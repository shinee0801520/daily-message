const key='daily-message-v1';
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei'}).format(new Date());
function seededIndex(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return Math.abs(h)%messages.length}
function reveal(i){quote.innerText=messages[i][0];guide.innerText=messages[i][1];card.classList.add('flipped');draw.textContent='今天已經抽過了 ♡';draw.disabled=true;draw.style.opacity=.72;share.classList.remove('hidden');foot.textContent='明天，再回來聽一句新的話 ♡'}
let saved;try{saved=JSON.parse(localStorage.getItem(key)||'null')}catch(e){}
if(saved&&saved.date===today()) reveal(saved.index);
draw.addEventListener('click',()=>{const i=seededIndex(today()+'|'+Math.random().toString(36).slice(2));localStorage.setItem(key,JSON.stringify({date:today(),index:i}));reveal(i)});
share.addEventListener('click',async()=>{const txt=`給今天的我一句話 ♡\n\n${quote.innerText}\n\n${guide.innerText}`;try{if(navigator.share){await navigator.share({title:'給今天的你一句話',text:txt})}else{await navigator.clipboard.writeText(txt);toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}}catch(e){}});
